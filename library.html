<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Library</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>My Music Library</h1>

  <input 
    type="text" 
    id="search" 
    placeholder="Search songs..." 
    aria-label="Search songs"
  >

  <div id="songList"></div>

  <script>
    const API_URL = "/songs";

    async function loadSongs() {
      const res = await fetch(API_URL);
      const songs = await res.json();

      const list = document.getElementById("songList");
      list.innerHTML = "";

      songs.forEach(song => {
        const div = document.createElement("div");
        div.className = "song";

        div.innerHTML = `
          <img src="${song.cover}" alt="Album cover for ${song.title}">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
          <p>${song.album}</p>

          <button data-id="${song._id}" class="favoriteBtn" type="button">
            ${song.favorite ? "★ Favorite" : "☆ Mark Favorite"}
          </button>

          <button data-id="${song._id}" class="deleteBtn" type="button">
            Delete
          </button>
        `;

        list.appendChild(div);
      });

      attachEvents();
    }

    function attachEvents() {
      document.querySelectorAll(".favoriteBtn").forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          await fetch(`${API_URL}/${id}/favorite`, { method: "PATCH" });
          loadSongs();
        };
      });

      document.querySelectorAll(".deleteBtn").forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          await fetch(`${API_URL}/${id}`, { method: "DELETE" });
          loadSongs();
        };
      });
    }

    document.getElementById("search").oninput = async (e) => {
      const term = e.target.value.toLowerCase();
      const res = await fetch(API_URL);
      const songs = await res.json();

      const filtered = songs.filter(song =>
        song.title.toLowerCase().includes(term) ||
        song.artist.toLowerCase().includes(term)
      );

      const list = document.getElementById("songList");
      list.innerHTML = "";

      filtered.forEach(song => {
        const div = document.createElement("div");
        div.className = "song";

        div.innerHTML = `
          <img src="${song.cover}" alt="Album cover for ${song.title}">
          <h3>${song.title}</h3>
          <p>${song.artist}</p>
          <p>${song.album}</p>

          <button data-id="${song._id}" class="favoriteBtn" type="button">
            ${song.favorite ? "★ Favorite" : "☆ Mark Favorite"}
          </button>

          <button data-id="${song._id}" class="deleteBtn" type="button">
            Delete
          </button>
        `;

        list.appendChild(div);
      });

      attachEvents();
    };

    loadSongs();
  </script>

</body>
</html>
